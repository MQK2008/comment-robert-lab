<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <link rel="icon" href="data:,">
  <title>评论罗伯特实验室</title>
  <style>
    :root {
      --page-bg: #eef0f3;
      --panel-border: #dfe3e8;
      --ink: #1f2329;
      --ink-soft: #6b7280;
      --accent: #ff7a3d;
      --danger: #e6483c;
      --danger-soft-fixed: #fdeceb;
      --shadow: 0 1px 2px rgba(20, 20, 25, .04), 0 8px 24px rgba(20, 20, 25, .06);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      background: var(--page-bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 28px 18px 64px;
    }

    .wb-shell {
      background: #f7f8fa;
      border: 1px solid #e3e6ea;
      border-radius: 16px;
      padding: 14px;
      box-shadow: var(--shadow);
    }

    .wb-card {
      overflow: hidden;
      border-radius: 12px;
      padding: 16px 18px 8px;
      background: #fff;
      color: #181818;
    }

    .wb-head { display: flex; gap: 10px; }

    .wb-avatar {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--wb-a1, #ffb35e), var(--wb-a2, #ff7a3d));
      color: #fff;
      font-size: 16px;
      font-weight: 700;
    }

    .wb-who { flex: 1; min-width: 0; }
    .wb-name-row { display: flex; align-items: center; gap: 5px; }
    .wb-name { color: #181818; font-size: 15px; font-weight: 600; }
    .wb-badge { width: 14px; height: 14px; flex: 0 0 auto; }

    .wb-tagline {
      margin-left: 2px;
      padding: 1px 5px;
      border-radius: 4px;
      background: #fff2e4;
      color: #e07a1f;
      font-size: 11px;
    }

    .wb-meta { margin-top: 2px; color: #999; font-size: 12px; }

    .wb-text {
      margin: 10px 0 12px;
      color: #181818;
      font-size: 14.5px;
      line-height: 1.65;
    }

    .wb-media {
      display: block;
      width: 100%;
      aspect-ratio: 3 / 2;
      margin-bottom: 12px;
      border-radius: 10px;
      object-fit: cover;
      background: #eceff2;
    }

    .wb-ai {
      margin-bottom: 12px;
      padding: 12px 14px;
      border: 1px solid #ffe3c7;
      border-radius: 10px;
      background: #fff8f2;
    }

    .wb-ai-head { display: flex; align-items: center; gap: 7px; margin-bottom: 9px; }

    .wb-ai-icon {
      display: flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 6px;
      background: var(--accent);
    }

    .wb-ai-icon svg { width: 12px; height: 12px; fill: #fff; }
    .wb-ai-name { color: #181818; font-size: 13px; font-weight: 700; }
    .wb-ai-sub { margin-left: 2px; color: #b08256; font-size: 11px; }
    .wb-ai-summary { color: #333; font-size: 13px; font-weight: 500; line-height: 1.6; overflow-wrap: anywhere; }
    #ratioBlock { margin-top: 10px; }
    .wb-ai-pct-row { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
    .wb-ai-pct-num { color: var(--danger); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .wb-ai-pct-label { color: #5b5b5b; font-size: 12px; }

    .wb-ai-bar {
      height: 6px;
      overflow: hidden;
      border-radius: 4px;
      background: #ffe3c7;
    }

    .wb-ai-bar-fill { width: 0%; height: 100%; border-radius: 4px; background: var(--danger); transition: width .5s ease; }

    .wb-topbar { display: flex; align-items: center; margin: -16px -18px 12px; padding: 11px 16px; border-bottom: 1px solid #f0f0f0; color: #181818; font-size: 14px; }
    .wb-topbar .wb-back { width: 60px; font-size: 14px; }
    .wb-topbar .wb-top-title { flex: 1; text-align: center; font-size: 15px; font-weight: 600; }
    .wb-topbar .wb-top-gap { width: 60px; }
    .wb-follow { align-self: flex-start; flex: 0 0 auto; padding: 4px 14px; border: 1px solid #ff8a3d; border-radius: 16px; color: #ff6a1a; font-size: 13px; }

    .wb-engage {
      display: flex;
      justify-content: space-around;
      margin: 0 -18px;
      padding: 12px 8px;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }

    .wb-engage > span { display: flex; align-items: center; gap: 6px; color: #666; font-size: 13px; }
    .wb-engage svg { width: 17px; height: 17px; fill: none; stroke: #8a8a8a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .wb-compose { padding: 12px 0 6px; }
    .wb-compose-row { display: flex; align-items: center; gap: 10px; }
    .wb-me { display: flex; flex: 0 0 auto; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 50%; background: #eceff2; }
    .wb-me svg { width: 18px; height: 18px; fill: none; stroke: #9aa1ab; stroke-width: 1.6; }
    .wb-input { flex: 1; padding: 10px 12px; border-radius: 6px; background: #f2f3f5; color: #a3a8b0; font-size: 13.5px; }
    .wb-compose-tools { display: flex; align-items: center; gap: 14px; margin-top: 10px; padding-left: 44px; color: #666; font-size: 13px; }
    .wb-compose-tools svg { width: 19px; height: 19px; fill: none; stroke: #8a8a8a; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .wb-fwd { display: inline-flex; align-items: center; gap: 6px; }
    .wb-fwd i { width: 14px; height: 14px; border: 1px solid #bfc4cc; border-radius: 3px; }
    .wb-post { margin-left: auto; padding: 7px 22px; border-radius: 18px; background: #fcc27d; color: #fff; font-size: 13.5px; font-weight: 600; }
    .wb-tabs { display: flex; gap: 22px; margin: 14px 0 4px; font-size: 14px; color: #555; }
    .wb-tabs .is-on { color: #ff7a1a; font-weight: 700; }
    .wb-comments { display: flex; flex-direction: column; }

    .wb-comment {
      display: flex;
      gap: 9px;
      padding: 9px 0;
      border-top: 1px solid #f4f4f4;
    }

    .wb-comment:first-child { border-top: 0; }
    .wb-comment.is-neg { margin: 0 -18px; padding: 9px 18px; background: linear-gradient(90deg, #fff5f4, transparent 40%); }
    .wb-comment.is-neg .wb-c-avatar { background: #e0a49c; }

    .wb-c-avatar {
      width: 30px;
      height: 30px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--c-color, #c9c9c9);
    }

    .wb-c-body { flex: 1; min-width: 0; }
    .wb-c-line { font-size: 13.5px; line-height: 1.55; color: #242424; }
    .wb-c-name { color: #e07a1f; font-weight: 500; }
    .wb-c-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 3px; color: #a3a3a3; font-size: 11.5px; }
    .wb-c-info { display: inline-flex; align-items: center; gap: 8px; min-width: 0; }
    .wb-c-actions { display: inline-flex; align-items: center; gap: 12px; flex: 0 0 auto; }
    .wb-c-actions svg { width: 14px; height: 14px; fill: none; stroke: #a3a3a3; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .wb-c-actions span { margin-left: -6px; }
    .wb-replies { margin-top: 7px; padding: 2px 0 2px 10px; border-left: 2px solid #f0f0f0; font-size: 12.5px; line-height: 1.6; color: #333; }
    .wb-replies div { padding: 3px 0; }
    .wb-replies b { color: #e07a1f; font-weight: 500; }
    .wb-replies .more { color: #e07a1f; }

    .wb-c-neg-chip {
      display: inline-flex;
      align-items: center;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--danger-soft-fixed);
      color: var(--danger);
      font-size: 10.5px;
      font-weight: 600;
    }

    .wb-viewall { padding: 11px 0 13px; color: #999; font-size: 12.5px; text-align: center; }

    .error-card {
      padding: 48px 24px;
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      background: #fff;
      box-shadow: var(--shadow);
      text-align: center;
    }

    .error-card h1 { margin: 0 0 10px; color: #181818; font-size: 22px; }
    .error-card p { margin: 0; color: var(--ink-soft); font-size: 14px; line-height: 1.7; }
    .is-hidden { display: none !important; }

    .loading {
      height: 520px;
      border-radius: 16px;
      background: linear-gradient(100deg, #f7f8fa 20%, #fff 38%, #f7f8fa 56%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite linear;
    }

    @keyframes shimmer { to { background-position-x: -200%; } }

    .continue-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(255,255,255,.96); border-top: 1px solid #e6e8ec; transform: translateY(0); transition: transform .35s ease; }
    .continue-bar.is-hidden { display: block !important; transform: translateY(110%); pointer-events: none; }
    .continue-btn { display: block; width: min(100%, 612px); min-height: 44px; margin: 0 auto; border: 0; border-radius: 10px; background: #23262b; color: #fff; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
    .continue-btn:active { transform: scale(.98); }

    .survey-card { padding: 22px 22px 26px; border: 1px solid var(--panel-border); border-radius: 16px; background: #fff; box-shadow: var(--shadow); }
    .survey-progress { height: 6px; margin-bottom: 18px; overflow: hidden; border-radius: 4px; background: #eceff2; }
    .survey-progress div { width: 4%; height: 100%; background: #23262b; }
    .survey-step { color: var(--ink-soft); font-size: 12px; }
    .survey-card h1 { margin: 4px 0 10px; font-size: 22px; }
    .survey-intro { margin: 0 0 22px; color: #4b5563; font-size: 14px; line-height: 1.75; }
    .survey-q-title { margin-bottom: 12px; font-size: 14.5px; font-weight: 600; line-height: 1.6; }
    .likert { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; color: #6b7280; }
    .likert label { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: 8px; cursor: pointer; }
    .likert label:hover { background: #f4f5f7; }
    .likert-ends { display: flex; justify-content: space-between; margin-top: 4px; color: #9aa1ab; font-size: 11.5px; }
    .survey-actions { display: flex; justify-content: flex-end; margin-top: 26px; }
    .survey-next { min-width: 112px; min-height: 44px; border: 0; border-radius: 10px; background: #23262b; color: #fff; font: inherit; font-size: 14px; font-weight: 600; }
    .survey-next:disabled { background: #c9cdd3; }
    .survey-note { margin: 16px 0 0; color: #b0b5bd; font-size: 11.5px; text-align: center; }

    @media (max-width: 480px) {
      .page { padding: 16px 10px 80px; }
      .wb-shell { padding: 8px; }
      .wb-card { padding-inline: 14px; }
      .wb-comment.is-neg { margin-inline: -14px; padding-inline: 14px; }
      .wb-ai-head { align-items: flex-start; flex-wrap: wrap; }
      .wb-ai-sub { width: calc(100% - 29px); margin-left: 27px; margin-top: -5px; }
      .wb-engage { margin-inline: -14px; }
      .wb-topbar { margin-inline: -14px; }
      .wb-compose-tools { padding-left: 0; }
      .wb-share-more { display: none; }
      .page { padding-bottom: 80px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="page">

          base: 19 * 60 + 12,
          replies: [["路过的小鱼", "住的哪家酒店呀"], ["阿宁", "几月去的，人多吗"]],
          text: "攒了大半年年假和预算，终于去了马尔代夫圆梦！海水蓝到发光，躺在水屋里看日落，什么烦恼都没了～问我攻略的姐妹评论区扣1",
          summary: "评论区围绕海岛风光、酒店住宿、行程安排与签证机票展开讨论，涉及出行准备、旅行体验和拍照分享等话题。",
          image: "assets/images/马尔代夫-高清.jpg",
          imageAlt: "一张马尔代夫海岛照片",
          colors: ["#5fc2ea", "#0e6ba8"],
          engage: { repost: 27, like: 66 },
          positives: [
            "这蓝也太治愈了吧，人生赢家",
            "求酒店链接，攒钱去",
            "签证好办吗，机票哪里买的划算",
            "羡慕住上水屋了，一直想去",
            "这日落绝了，帮我保存了",
            "什么时候去的，人多不多",
            "求详细行程和花费明细",
            "拍照技术也太好了吧",
            "已经心动，准备下个月安排上"
          ],
          negatives: [
            "秀什么秀，不就是花钱吗",
            "有钱人的世界，打工人不懂",
            "天天出去玩，工作谁做的",
            "又是凡尔赛文学，看烦了"
          ],
          incoming: {
            negatives: ["有钱人的快乐我们不懂，别炫了", "这种炫耀式旅行看着真心累"],
            positives: ["已经心动，准备存钱去", "这滤镜也太好看了吧", "求同款泳衣链接", "看完好想立刻请假"]
          },
          extra: {
            positives: ["博主拍照审美真的绝了", "已经安利给闺蜜了", "期待下一期旅行攻略"]
          }
        }
      };

      var COMMENT_NAMES = ["青禾不迟", "阿樱不迷路", "橙子不吃苹果", "半岛铁盒", "小满未满", "拿铁不加糖", "云边小卖部", "阿May", "北岸暮色", "一饱十年", "陈皮拿铁", "旧巷猫", "阿虎爱睡觉"];
      var EXTRA_NAMES = ["深夜路人甲", "橘子汽水味", "不打烊便利店", "糖醋排骨", "慢半拍青年", "雾里看花", "三分甜", "晚风不燥", "柚子茶少女"];
      var REGIONS = ["上海", "广东", "北京", "江苏", "浙江", "四川", "山东", "湖北", "福建", "河南", "天津", "重庆", "湖南"];
      var ICON_ACTIONS = '<svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg><svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 01-12.3 7.5L3 21l1.9-5.7A8.5 8.5 0 1121 11.5z"/></svg><svg viewBox="0 0 24 24"><path d="M14 9V5a3 3 0 00-3-3l-4 9v11h11.28a2 2 0 002-1.7l1.38-9a2 2 0 00-2-2.3H14z"/><path d="M7 22H4a2 2 0 01-2-2v-7a2 2 0 012-2h3"/></svg>';
      var COMMENT_COLORS = ["#ffb35e", "#8bd3c7", "#f4a6a0", "#a0c4ff", "#c9b1ff", "#ffd97d", "#9ad0c2", "#f7b7a3"];
      var VISIBLE_PATTERN = ["p", "p", "n", "p", "p", "n", "p", "p", "n", "p", "p", "n", "p"];
      var RATIO_MODES = ["none", "static", "dynamic"];
      var RATIO_BASE = 32;

      function el(id) { return document.getElementById(id); }

      function makeGroup() {
        return {
          topic: Math.random() < 0.5 ? "food" : "travel",
          ratioMode: RATIO_MODES[Math.floor(Math.random() * RATIO_MODES.length)],
          aiLabelShown: Math.random() < 0.5
        };
      }

      function makeSession() {
        return { version: 3, group: makeGroup() };
      }

      function makeReviewSession(code) {
        var match = /^(F|T)(N|S|D)([01])$/.exec(code || "");
        if (!match) return null;
        return {
          version: 3,
          group: {
            topic: match[1] === "F" ? "food" : "travel",
            ratioMode: match[2] === "N" ? "none" : (match[2] === "S" ? "static" : "dynamic"),
            aiLabelShown: match[3] === "1"
          },
          reviewMode: true
        };
      }

      function isValidGroup(group) {
        return group && (group.topic === "food" || group.topic === "travel") &&
          RATIO_MODES.indexOf(group.ratioMode) !== -1 &&
          typeof group.aiLabelShown === "boolean";
      }

      function isValidSession(value) {
        return value && value.version === 3 && isValidGroup(value.group);
      }

      function loadSession() {
        var saved = sessionStorage.getItem(STORAGE_KEY);
        if (saved) {
          try {
            var parsed = JSON.parse(saved);
            if (isValidSession(parsed)) return parsed;
          } catch (error) {
            sessionStorage.removeItem(STORAGE_KEY);
          }
        }
        var created = makeSession();
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(created));
        return created;
      }

      function buildComments(topic) {
        var positiveIndex = 0;
        var negativeIndex = 0;
        return VISIBLE_PATTERN.map(function (kind) {
          if (kind === "n") return { text: topic.negatives[negativeIndex++], negative: true };
          return { text: topic.positives[positiveIndex++], negative: false };
        });
      }

      function buildRow(name, text, colorIndex, flagged, timeText, region, likeText) {
        var row = document.createElement("div");
        var avatar = document.createElement("div");
        var body = document.createElement("div");
        var line = document.createElement("div");
        var nameEl = document.createElement("span");
        var meta = document.createElement("div");
        var info = document.createElement("span");
        var actions = document.createElement("span");

        row.className = "wb-comment" + (flagged ? " is-neg" : "");
        avatar.className = "wb-c-avatar";
        avatar.style.setProperty("--c-color", COMMENT_COLORS[colorIndex % COMMENT_COLORS.length]);
        body.className = "wb-c-body";
        line.className = "wb-c-line";
        nameEl.className = "wb-c-name";
        nameEl.textContent = name;
        line.append(nameEl, "：" + text);
        meta.className = "wb-c-meta";
        info.className = "wb-c-info";
        info.append(timeText + " 来自 " + region);
        if (flagged) {
          var chip = document.createElement("span");
          chip.className = "wb-c-neg-chip";
          chip.textContent = "AI 标记";
          info.appendChild(chip);
        }
        actions.className = "wb-c-actions";
        actions.innerHTML = ICON_ACTIONS + "<span></span>";
        actions.lastChild.textContent = likeText;
        meta.append(info, actions);
        body.append(line, meta);
        row.append(avatar, body);
        return row;
      }

      function clock(topic, offset) {
        var m = topic.base + offset;
        return topic.date + " " + String(Math.floor(m / 60) % 24).padStart(2, "0") + ":" + String(m % 60).padStart(2, "0");
      }

      function renderComments(topic, aiLabelShown) {
        var wrap = el("wbComments");
        wrap.replaceChildren();
        buildComments(topic).forEach(function (comment, index) {
          var flagged = comment.negative && aiLabelShown;
          var row = buildRow(COMMENT_NAMES[index], comment.text, index, flagged, clock(topic, 3 + index * 7), REGIONS[index % REGIONS.length], String(2 + (index * 3) % 18));
          if (index === 1) {
            var box = document.createElement("div");
            box.className = "wb-replies";
            topic.replies.forEach(function (r) {
              var d = document.createElement("div");
              var b = document.createElement("b");
              b.textContent = r[0];
              d.append(b, "：" + r[1]);
              box.appendChild(d);
            });
            var more = document.createElement("div");
            more.className = "more";
            more.textContent = "共 3 条回复 ▾";
            box.appendChild(more);
            row.querySelector(".wb-c-body").appendChild(box);
          }
          wrap.appendChild(row);
        });
      }

      var newCommentSeq = 0;

      function prependNewComments(items, aiLabelShown) {
        var wrap = el("wbComments");
        var frag = document.createDocumentFragment();
        items.forEach(function (item) {
          var flagged = item.negative && aiLabelShown;
          var row = buildRow(item.name, item.text, COMMENT_NAMES.length + newCommentSeq, flagged, "刚刚", REGIONS[(newCommentSeq * 5) % REGIONS.length], String(Math.floor(Math.random() * 4)));
          newCommentSeq += 1;
          frag.appendChild(row);
        });
        wrap.prepend(frag);
      }

      var ratioTimers = [];

      function clearRatioTimers() {
        ratioTimers.forEach(function (t) { clearTimeout(t); });
        ratioTimers = [];
      }

      function renderRatio(ratioMode, topic, aiLabelShown) {
        clearRatioTimers();
        var block = el("ratioBlock");
        var numEl = el("pctNum");
        var barEl = el("pctBar");

        if (ratioMode === "none") {
          block.classList.add("is-hidden");
          return;
        }
        block.classList.remove("is-hidden");

        if (ratioMode === "static") {
          numEl.textContent = RATIO_BASE + "%";
          barEl.style.width = RATIO_BASE + "%";
          return;
        }

        numEl.textContent = "30%";
        barEl.style.width = "30%";

        ratioTimers.push(setTimeout(function () {
          numEl.textContent = "40%";
          barEl.style.width = "40%";
          var items = [];
          topic.incoming.negatives.forEach(function (text) { items.push({ name: EXTRA_NAMES[items.length], text: text, negative: true }); });
          topic.incoming.positives.forEach(function (text) { items.push({ name: EXTRA_NAMES[items.length], text: text, negative: false }); });
          prependNewComments(items, aiLabelShown);
        }, 3000));

        ratioTimers.push(setTimeout(function () {
          numEl.textContent = RATIO_BASE + "%";
          barEl.style.width = RATIO_BASE + "%";
          var items = topic.extra.positives.map(function (text, i) { return { name: EXTRA_NAMES[6 + i], text: text, negative: false }; });
          prependNewComments(items, aiLabelShown);
        }, 6000));
      }

      function renderScene(session) {
        var topic = TOPICS[session.group.topic];

        el("wbAvatar").textContent = topic.avatarInit;
        el("wbAvatar").style.setProperty("--wb-a1", topic.colors[0]);
        el("wbAvatar").style.setProperty("--wb-a2", topic.colors[1]);
        el("aiSummary").textContent = topic.summary;
        el("wbName").textContent = topic.name;
        el("wbTopTitle").textContent = topic.name;
        el("wbTag").textContent = topic.tag;
        el("wbMeta").textContent = topic.meta;
        el("wbText").textContent = topic.text;
        el("wbMedia").src = topic.image;
        el("wbMedia").alt = topic.imageAlt;
        el("engRepost").textContent = topic.engage.repost;
        el("engLike").textContent = topic.engage.like;

        renderComments(topic, session.group.aiLabelShown);
        renderRatio(session.group.ratioMode, topic, session.group.aiLabelShown);

        el("loading").classList.add("is-hidden");
        el("experiment").classList.remove("is-hidden");
      }

      try {
        var reviewCode = new URLSearchParams(window.location.search).get("review");
        var session = makeReviewSession(reviewCode) || loadSession();
        renderScene(session);

        var likert = el("likert");
        for (var n = 1; n <= 7; n++) {
          var lab = document.createElement("label");
          var inp = document.createElement("input");
          inp.type = "radio";
          inp.name = "q1";
          inp.value = n;
          inp.addEventListener("change", function () { el("surveyNext").disabled = false; });
          lab.append(inp, String(n));
          likert.appendChild(lab);
        }

        setTimeout(function () { el("continueBar").classList.remove("is-hidden"); }, session.reviewMode ? 1000 : 10000);
        el("continueBtn").addEventListener("click", function () {
          clearRatioTimers();
          el("experiment").classList.add("is-hidden");
          el("continueBar").classList.add("is-hidden");
          el("survey").classList.remove("is-hidden");
          window.scrollTo(0, 0);
        });
      } catch (error) {
        el("loading").classList.add("is-hidden");
        el("experiment").classList.add("is-hidden");
        el("errorCard").classList.remove("is-hidden");
      }
    }());
  </script>
</body>
</html>
